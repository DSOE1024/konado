name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned actionlint image; this workflow is the only place that pins it.
  ACTIONLINT_VERSION: 1.7.7

jobs:
  actionlint:
    name: Lint all workflows
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Every workflow is checked in its own run so the log reports a PASS or
      # FAIL line per file, together with the errors of the failing files.
      # -verbose makes actionlint log the project it resolved and
      # "Found total N errors ... for <file>" even when a file is clean, so a
      # successful run still proves that every file was parsed and checked.
      # actionlint still resolves the repository root from each path argument,
      # so local reusable workflow calls stay validated. The official image
      # bundles shellcheck and pyflakes, so run: scripts are checked too.
      - name: Check every workflow file
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )

          if (( ${#files[@]} == 0 )); then
            echo "::error::No workflow file was found under .github/workflows."
            exit 1
          fi

          failed=0
          for file in "${files[@]}"; do
            # -verbose must precede the file path: the flag parser stops at the
            # first non-flag argument.
            if output="$(docker run --rm \
              -v "$PWD:/repo" \
              -w /repo \
              "rhysd/actionlint:${ACTIONLINT_VERSION}" \
              -verbose \
              "$file" 2>&1)"; then
              echo "PASS: $file"
            else
              echo "FAIL: $file"
              failed=$((failed + 1))
            fi
            printf '%s\n' "$output"
          done

          if (( failed > 0 )); then
            echo "::error::actionlint reported problems in ${failed} of ${#files[@]} workflow file(s)."
            exit 1
          fi
          echo "All ${#files[@]} workflow file(s) passed actionlint."
