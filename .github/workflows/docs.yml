name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/generate-konado-case.mjs"
      - ".github/workflows/docs.yml"
      - ".github/workflows/update-showcase.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/generate-konado-case.mjs"
      - ".github/workflows/docs.yml"
      - ".github/workflows/update-showcase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VitePress
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        working-directory: docs
        run: pnpm docs:build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-site
          path: docs/.vitepress/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  update-showcase:
    name: Update showcase
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: build
    permissions:
      contents: write
    uses: ./.github/workflows/update-showcase.yml

  deploy:
    name: Deploy docs branch
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [build, update-showcase]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download site
        uses: actions/download-artifact@v4
        with:
          name: vitepress-site
          path: site

      - name: Publish docs branch
        shell: bash
        env:
          DOCS_BRANCH: docs
        run: |
          set -euo pipefail
          deploy_dir="$RUNNER_TEMP/konado-docs-branch"
          remote_sha="$(git ls-remote --heads origin "$DOCS_BRANCH" | awk '{print $1}')"

          if [ -n "$remote_sha" ]; then
            git fetch origin "refs/heads/$DOCS_BRANCH:refs/remotes/origin/$DOCS_BRANCH"
            git worktree add --detach "$deploy_dir" "origin/$DOCS_BRANCH"
          else
            git worktree add --detach "$deploy_dir" HEAD
          fi

          cd "$deploy_dir"
          git switch --orphan docs-deploy
          git rm -rf . >/dev/null 2>&1 || true
          cp -R "$GITHUB_WORKSPACE/site/." .
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: deploy ${GITHUB_SHA::8}"

          if [ -n "$remote_sha" ]; then
            git push origin HEAD:"$DOCS_BRANCH" \
              --force-with-lease="refs/heads/$DOCS_BRANCH:$remote_sha"
          else
            git push origin HEAD:"$DOCS_BRANCH"
          fi
